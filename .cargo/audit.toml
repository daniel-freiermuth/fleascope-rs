[advisories]
# Advisories that cannot be fixed by a lockfile update because polars 0.55
# pins the affected crate to a vulnerable semver range. The code path is not
# used by fleascope-rs. Remove each entry once a polars upgrade lifts the
# dependency past the patched version (`cargo audit` then passes without it).
ignore = [
    # quick-xml 0.39.4 via object_store 0.13 (polars-io "cloud", on by
    # default). Patched in quick-xml >= 0.41; polars 0.55.2 still uses 0.39.
    # Only parses cloud-storage XML responses; fleascope-rs does no cloud I/O.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
