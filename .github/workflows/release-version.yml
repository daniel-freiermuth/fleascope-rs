name: Release version

# Checks, publishes, tags and releases one version. Called by release.yml for
# each untagged version bump; crates.io trusted publishing matches the calling
# workflow (release.yml), not this file.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit that bumps Cargo.toml to `version`
        type: string
        required: true
      version:
        description: Version to release, without the `v`
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Extract the CHANGELOG.md section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The section from `## [X.Y.Z]` up to the next `## [` heading,
          # without `---` separator lines.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]-]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ inputs.version }}
          path: release-notes.md

  checks:
    needs: notes
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.sha }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Already on crates.io?
        id: published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # A rerun after a failure past this job must not publish twice.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'fleascope-rs release workflow (github.com/daniel-freiermuth/fleascope-rs)' \
            "https://crates.io/api/v1/crates/fleascope-rs/$VERSION")
          echo "exists=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - if: steps.published.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.published.outputs.exists == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.published.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ inputs.version }}
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          # Releasing an older line (e.g. 1.1.x after 2.0.0) must not take
          # over "latest" from the highest version.
          highest=$( (gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name'; echo "$TAG") \
            | grep -E '^v[0-9]' | sort -V | tail -n 1)
          latest=false
          if [ "$TAG" = "$highest" ]; then latest=true; fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" \
            --notes-file release-notes.md --latest="$latest"
