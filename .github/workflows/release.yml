name: Release

# Publishes a tagged version to crates.io and creates its GitHub release.
#
# To release version X.Y.Z from any commit (master or a release/* branch):
#   1. Commit the version bump (Cargo.toml and Cargo.lock) together with a
#      `## [X.Y.Z] — YYYY-MM-DD` section in CHANGELOG.md, which becomes the
#      release notes.
#   2. Tag that commit `vX.Y.Z` and push the tag.
# A tag push runs this file as of the tagged commit. A commit that predates
# this file (e.g. a release branch cut from an older master) is released by
# running the workflow from master instead: Actions → Release → Run workflow,
# with the tag as input. Both run the same steps against the tagged commit.
#
# Publishing uses crates.io trusted publishing (no stored token). The crate's
# trusted publisher on crates.io must be: repository
# daniel-freiermuth/fleascope-rs, workflow `release.yml`, environment `release`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

# Never run two releases at once; never cancel one half-way through.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Tag, Cargo.toml and CHANGELOG.md agree
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          # The section from `## [X.Y.Z]` up to the next `## [` heading,
          # without `---` separator lines.
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]-]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Releasing an older line (e.g. 1.1.x after 2.0.0) must not take
          # over "latest" from the highest version.
          highest=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]' | sort -V | tail -n 1)
          latest=false
          if [ "$TAG" = "$highest" ]; then latest=true; fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file release-notes.md --latest="$latest"
