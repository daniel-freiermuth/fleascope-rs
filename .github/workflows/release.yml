name: Release

# Releases every version bump that is not tagged yet.
#
# To release version X.Y.Z, commit the version bump (Cargo.toml and
# Cargo.lock) together with a `## [X.Y.Z] — YYYY-MM-DD` section in
# CHANGELOG.md, and push it to master (or to a release/* branch for an older
# line). On every push this workflow walks the first-parent history since the
# newest `v*` tag; each commit that changes the Cargo.toml version, oldest
# first, is checked, published to crates.io, tagged `vX.Y.Z` and released on
# GitHub with its changelog section as notes. Pushes without a version bump
# release nothing. A failed release is retried by the next push or by
# Actions → Release → Run workflow.
#
# Publishing uses crates.io trusted publishing (no stored token). The crate's
# trusted publisher on crates.io must be: repository
# daniel-freiermuth/fleascope-rs, workflow `release.yml`, environment `release`.

on:
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once; never cancel one half-way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find untagged version bumps
        id: plan
        run: |
          version_at() {
            git show "$1:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1
          }
          since=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${since:+$since..}HEAD
          releases='[]'
          for sha in $(git rev-list --reverse --first-parent "$range"); do
            version=$(version_at "$sha")
            parent=$(git rev-parse --verify --quiet "$sha^") && [ "$(version_at "$parent")" = "$version" ] && continue
            if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
              echo "v$version is already tagged; skipping ${sha:0:7}"
              continue
            fi
            echo "Release v$version from ${sha:0:7} $(git log -1 --format=%s "$sha")"
            releases=$(jq -c --arg sha "$sha" --arg version "$version" '. + [{sha: $sha, version: $version}]' <<<"$releases")
          done
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    strategy:
      # In order, and stop at the first failure.
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    uses: ./.github/workflows/release-version.yml
    with:
      sha: ${{ matrix.sha }}
      version: ${{ matrix.version }}
    permissions:
      contents: write
      id-token: write
