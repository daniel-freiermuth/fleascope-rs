name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run on the newest stable toolchain against the committed
    # Cargo.lock, to catch toolchain drift (e.g. ethnum 1.5.2 stopped
    # compiling on new rustc) before a user does.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No `-D warnings`: Cargo.toml's [lints] table is the policy. Its
      # `deny` lints (clippy::all, unwrap_used, expect_used, indexing_slicing,
      # panic, todo, fallible_impl_from, unused_must_use) and `forbid`
      # (unsafe_code) fail the job; `warn` lints (pedantic, nursery, cargo)
      # are reported only. clippy.toml exempts tests from the panic family.
      - run: cargo clippy --locked --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests use fake serial ports and device discovery tolerates
      # zero devices, so no FleaScope hardware is needed. Includes doctests.
      - run: cargo test --locked

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Checks Cargo.lock against the RustSec advisory database (fetched
      # fresh on every run, so the weekly schedule also catches advisories
      # published after a change landed). Vulnerabilities fail the job;
      # unmaintained/yanked notices are reported as warnings only.
      - run: cargo audit
